name: Release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          name="dev.orpheon.eclipsebridge-${version}.zip"
          zip -j "$name" manifest.json main.js README.md NOTICE.md LICENSE
          cp "$name" extension.zip
          sha256sum "$name" extension.zip
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PACKAGE" \
            extension.zip \
            --title "Orpheon Eclipse Bridge $GITHUB_REF_NAME" \
            --notes-file README.md
